server.port=8086

spring.application.name=ms-auth

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/db_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:trans-cargo-erp-clave-secreta-desarrollo-minimo-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}