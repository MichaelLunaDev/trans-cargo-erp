server.port=8084

spring.application.name=ms-carga

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/db_carga?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

carga.peso-bruto-maximo-kg=48000
carga.peso-maximo-por-eje-kg=11000
