server.port=8081

spring.application.name=ms-viajes

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/db_viajes}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# si RabbitMQ esta caido, la publicacion falla rapido y no bloquea el inicio del viaje
spring.rabbitmq.connection-timeout=3s

servicios.flota.url=${FLOTA_URL:http://localhost:8082}
servicios.conductores.url=${CONDUCTORES_URL:http://localhost:8083}

spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
